/* nav */

    <h1>Shared genetic architecture of coronary artery disease and rheumatoid arthritis</h1>
    <p class="lead">People with rheumatoid arthritis are more likely to develop heart disease. I wanted to know whether the two diseases share a genetic basis, and what that shared signal is doing at the molecular level.</p>
  </div></div>
  <div class="page-body"><div class="pp-inner">
    <dl class="details">
      <div><dt>Type</dt><dd>Independent project</dd></div>
      <div><dt>Data</dt><dd>GWAS Catalog, ENCODE, eQTLGen</dd></div>
      <div><dt>Genome build</dt><dd>GRCh37 / hg19</dd></div>
      <div><dt>Code</dt><dd><a href="https://github.com/Gautami1412/GWAS-ChIPseq-CAD-RA-MultiOmics" target="_blank" rel="noopener">GitHub ↗</a></dd></div>
    </dl>
    <figure><img src="fig1_filtering_funnel.png" alt="Filtering funnel from 18,349 CAD and 35,227 RA variants down to 3 validated HLA-C cis-eQTLs"><figcaption>Each step adds a separate line of evidence: association with both diseases, location inside a gene, active chromatin in the relevant immune cells, and a measured effect on gene expression.</figcaption></figure>

    <h2>What I did</h2>
    <p>I started from two large public GWAS: coronary artery disease (Aragam et al. 2022, over a million people) and rheumatoid arthritis (Ishigaki et al. 2022, five ancestry groups). Filtering both at genome-wide significance (p &lt; 5×10⁻⁸) gave 18,349 CAD and 35,227 RA variants, and 160 of them were significant in both diseases.</p>
    <p>I mapped those 160 SNPs to their nearest genes with bedtools, which left 38 SNPs sitting directly inside a gene. Next I asked whether those SNPs fall on "switched-on" DNA. I used H3K27ac ChIP-seq from ENCODE for two cell types: CD4+ T cells, which attack joint tissue in RA, and CD14+ monocytes, which become the cells that build arterial plaque in CAD. 15 SNPs were active in both. Finally, I checked those 15 against eQTLGen (31,684 blood samples) to see which ones actually change how much a gene is expressed.</p>
    <p>The whole analysis runs as eight numbered Bash scripts using awk, sort, comm, grep and bedtools, so it can be rerun from scratch and give the same numbers.</p>

    <h2>What I found</h2>
    <div class="nums"><div><b>160</b><span>SNPs shared by both diseases</span></div><div><b>15</b><span>active in both immune cell types</span></div><div><b>3</b><span>validated eQTLs, all for HLA-C</span></div></div>
    <p>The shared SNPs piled up in the HLA region on chromosome 6 (HLA-B, HLA-DRB1, HLA-DQA1, HLA-A), the immune system's control center. By the end of the funnel, all three validated variants regulate the same gene, <b>HLA-C</b>. The strongest, rs9266196, has a Z-score of about 47.6.</p>
    <p>Going from 53,000 variants to three that tell the same story suggests the overlap between RA and CAD is a specific immune-regulatory signal, not noise. It points to a shared genetic root, rather than RA simply causing heart disease through years of inflammation.</p>
    <figure><img src="fig3_eqtl_zscores.png" alt="eQTL Z-scores of the three validated SNPs for HLA-C"><figcaption>Effect of the three final SNPs on HLA-C expression in eQTLGen.</figcaption></figure>

    <h2>Limitations and next steps</h2>
    <ul>
      <li>The nearest gene is not always the causal gene. The eQTL step is there to add real evidence, but it doesn't settle it.</li>
      <li>This is a strong chain of evidence, not proof. Showing causation would take an experiment, such as editing the SNP in cells and measuring HLA-C.</li>
      <li>I didn't stratify by ancestry. Next I'd test each ancestry group separately and add more cell types and tissues.</li>
    </ul>

<template id="tpl-mtdna"><div class="page-hero"><div class="pp-inner">
    <a class="back" href="#projects">← All projects</a>
    
    <h1>Mitochondrial DNA heteroplasmy and preterm birth risk</h1>
    <p class="lead">Heteroplasmy means carrying a mix of slightly different mitochondrial DNA copies in your own cells. The placenta is extremely energy-hungry, so I asked whether this variation in mothers relates to preterm birth or gestational age.</p>
  </div></div>
  <div class="page-body"><div class="pp-inner">
    <dl class="details">
      <div><dt>Where</dt><dd>Children's Hospital of Philadelphia, Wallace Lab</dd></div>
      <div><dt>Data</dt><dd>8,599 mothers, 5 sites in Africa and South Asia</dd></div>
      <div><dt>Outcomes</dt><dd>Preterm birth, gestational age</dd></div>
      <div><dt>Code</dt><dd><a href="https://github.com/Gautami1412/mtDNA-Heteroplasmy-Analysis-Preterm-Birth-and-Gestational-Age" target="_blank" rel="noopener">GitHub ↗</a></dd></div>
    </dl>
    <figure><img src="mtdna_shap.png" alt="SHAP summary plot ranking site, mtDNA principal components, BMI and maternal age"><figcaption>SHAP summary for the Random Forest model. Site ranks highest, but several mtDNA components still move predictions on their own.</figcaption></figure>

    <h2>What I did</h2>
    <p>Each mother had 126 heteroplasmy variants measured, plus age and BMI. Because many variants are correlated, I compressed them with PCA into 14 components that keep about 80% of the variation. I tested those components with logistic regression (preterm birth) and linear regression (gestational age), with FDR correction.</p>
    <p>The key step was a mixed-effects model. Site turned out to be a huge predictor on its own, with some sites at 2–3 times the preterm-birth rate. A normal regression lets site soak up almost all the explanatory power. Treating site as a random effect separates differences between sites from differences between mothers at the same site, so a smaller biological signal can show through. I also trained a Random Forest with 5-fold cross-validation and used SHAP to see which features it relied on.</p>

    <h2>What I found</h2>
    <div class="nums"><div><b>126 → 14</b><span>variants compressed to PCs</span></div><div><b>4</b><span>mtDNA components significant in the mixed model</span></div><div><b>0.62</b><span>Random Forest AUC, combined cohort</span></div></div>
    <p>With site as a regular predictor, the Bangladesh and Pakistan sites showed 2.3–2.6 times higher odds of preterm birth and no mtDNA feature survived correction. With site as a random effect, four mtDNA components (PC1, PC5, PC11 and PC14) came out significant, along with maternal age. Testing all 125 raw variants one at a time didn't find anything the components had missed.</p>
    <p>So heteroplasmy carries a real but modest signal. It's one contributing factor, not a standalone predictor, and how you model site decides whether you can see it at all.</p>

    <h2>Limitations</h2>
    <ul>
      <li>Only 609 preterm cases out of 8,599, so PR-AUC was low (0.088) even though ROC-AUC was 0.62.</li>
      <li>In the African subcohort alone, AUC fell to 0.50. Part of the combined model's performance comes from learning which cohort a mother is in.</li>
    </ul>
    <div class="tools"><span>Python</span><span>pandas</span><span>statsmodels</span><span>scikit-learn</span><span>SHAP</span><span>HPC</span></div>

<template id="tpl-mitonuclear"><div class="page-hero"><div class="pp-inner">
    <a class="back" href="#projects">← All projects</a>
    
    <h1>Mitonuclear ancestry mismatch and preterm birth</h1>
    <p class="lead">Mitochondrial and nuclear genes evolved together and need to cooperate. Building on Crawford et al. (2018), I tested whether mothers whose mtDNA lineage doesn't match their population's ancestry have higher preterm-birth risk.</p>
  </div></div>
  <div class="page-body"><div class="pp-inner">
    <dl class="details">
      <div><dt>Where</dt><dd>Children's Hospital of Philadelphia, Wallace Lab</dd></div>
      <div><dt>Data</dt><dd>African and South Asian maternal cohorts</dd></div>
      <div><dt>Methods</dt><dd>Chi-square, Fisher's exact, logistic regression</dd></div>
      <div><dt>Presented</dt><dd>UD seminar, Feb 2026</dd></div>
    </dl>
    <figure><img src="mitonuclear_or.png" alt="Odds ratio 0.31, 95% CI 0.12 to 0.81, for L versus M; L versus E not significant"><figcaption>Only the most distant mismatch was associated with preterm birth. The M group is small, which is why the interval is wide.</figcaption></figure>

    <h2>What I did</h2>
    <p>Each mother's mtDNA haplogroup was grouped into one of five ancestral clusters (African, South Asian, East Asian and so on). I then scored whether her lineage matched the ancestry expected for her population. Because this was a direct hypothesis test rather than a prediction task, I used classical statistics: chi-square and Fisher's exact tests for the association, logistic regression for adjusted odds ratios, and Welch's t-test and OLS for gestational age.</p>

    <h2>What I found</h2>
    <p>In the African cohort, mothers with the matched African lineage (L) had 69% lower odds of preterm birth than mothers carrying the distant M lineage (OR 0.31, 95% CI 0.12–0.81, p = 0.016). A closer mismatch, the E lineage, showed no effect. In the South Asian cohort, where lineages are genetically closer after a long history of mixing, none of the comparisons were significant.</p>
    <p>That pattern suggests the effect scales with how far apart the two ancestries are, not just whether they differ. It agrees with the original paper, whose result also replicated in only one of two cohorts, and it extends the question to a population that paper never tested.</p>

    <h2>Limitations and next steps</h2>
    <ul>
      <li>Only 41 mothers carried the M lineage, so the result needs replication in a larger sample.</li>
      <li>Socioeconomic factors and healthcare access weren't modeled directly, and they can correlate with ancestry.</li>
      <li>A continuous, genotype-based ancestry-distance score would sharpen the analysis.</li>
    </ul>

<template id="tpl-hla"><div class="page-hero"><div class="pp-inner">

    <h1>Multi-ancestry HLA variant calling: benchmarking reference genome bias</h1>
    <p class="lead">Does GATK's industry-standard pipeline call variants equally well across ancestries in HLA, the most diverse and most reference-biased part of the genome? HLA drives transplant matching, autoimmune risk and drug reactions, so accuracy gaps there matter clinically.</p>
  </div></div>
  <div class="page-body"><div class="pp-inner">
    <dl class="details">
      <div><dt>Status</dt><dd>Pipeline built; compute running on AWS</dd></div>
      <div><dt>Samples</dt><dd>12 from 1000 Genomes + 3 GIAB</dd></div>
      <div><dt>Region</dt><dd>chr6:28.5–33.5 Mb (GRCh38)</dd></div>
      <div><dt>Code</dt><dd><a href="https://github.com/Gautami1412/hla-multi-ancestry-pipeline" target="_blank" rel="noopener">GitHub ↗</a></dd></div>
    </dl>
    <figure><img src="hla_pipeline.png" alt="Eight-stage pipeline from region extraction to benchmarking"><figcaption>The eight stages, following GATK Best Practices and orchestrated with Snakemake.</figcaption></figure>

    <h2>Design</h2>
    <p>The cohort is 12 samples from 1000 Genomes across four ancestry groups (African, European, South Asian and East Asian), plus three Genome in a Bottle samples (HG001, HG002, HG005) that have hand-curated truth sets to score accuracy against. I slice the extended HLA region (chr6:28,510,120–33,480,577) out of each sample's aligned CRAM and run it through the full pipeline, at about 1/500th the size of a whole genome.</p>
    <p>Reads are aligned to the full GRCh38 reference with decoy sequences, not an HLA-only reference. HLA genes look so alike that a small reference would misplace reads, which would undermine the benchmark. I use hard filters instead of VQSR because 15 samples is too few for VQSR to train on.</p>

    <h2>What I expect to find</h2>
    <ul>
      <li><b>An accuracy gap between European and East Asian genomes.</b> GRCh38 is built mostly from European-ancestry data, so I expect lower precision and recall for HG005 than HG001.</li>
      <li><b>A structural gap for African and South Asian genomes.</b> No GIAB truth set exists for these ancestries, so their calls can't be benchmarked at all. That missing resource is a finding in itself.</li>
    </ul>

    <h2>Where it stands</h2>
    <p>The full pipeline is written and passes a Snakemake dry run end to end. All reference data and all 15 samples are downloaded and indexed. Alignment needs more memory than my laptop has, so I'm moving the compute-heavy stages to AWS with Docker. There are no results yet.</p>

<template id="tpl-leukemia"><div class="page-hero"><div class="pp-inner">
    <a class="back" href="#projects">← All projects</a>
    
    <h1>Molecular classification of leukemia from gene expression</h1>
    <p class="lead">ALL and AML look alike under the microscope but need very different treatment. In 1999, Golub and colleagues showed they could be told apart from gene expression alone. I reproduced that result with modern machine learning and added SHAP to see which genes drive the predictions.</p>
  </div></div>
  <div class="page-body"><div class="pp-inner">
    <dl class="details">
      <div><dt>Type</dt><dd>Course final project</dd></div>
      <div><dt>Data</dt><dd>Golub et al. 1999 (Kaggle), 72 patients</dd></div>
      <div><dt>Features</dt><dd>7,129 genes (Affymetrix)</dd></div>
      <div><dt>Split</dt><dd>38 train / 34 test, as in the original</dd></div>
    </dl>
    <figure><img src="leukemia_accuracy.png" alt="Test-set accuracy: logistic regression and XGBoost 94.1%, MLP and Random Forest 85%, SVM about 65%"><figcaption>Accuracy on the 34 held-out patients. The dashed line is the original study's result.</figcaption></figure>

    <h2>What I did</h2>
    <p>I log₂-transformed the expression values, kept the 5,000 most variable genes and standard-scaled them. Every preprocessing step was fit on the training set only, to avoid leakage. PCA, UMAP and t-SNE all showed ALL and AML as clearly separate groups before any labels were used.</p>
    <p>I trained five classifiers covering a range of complexity: L2 logistic regression, Random Forest, an RBF-kernel SVM, XGBoost and a shallow neural network. I compared them with stratified 5-fold cross-validation, then evaluated each one once on the untouched test set. Finally, I ran SHAP on XGBoost to rank genes by their contribution.</p>

    <h2>What I found</h2>
    <div class="nums"><div><b>94.1%</b><span>test accuracy, logistic regression and XGBoost</span></div><div><b>&gt; 0.96</b><span>AUC for every model</span></div><div><b>3 of 5</b><span>top SHAP genes also in Golub's signature</span></div></div>
    <p>Logistic regression and XGBoost each misclassified only two of 34 patients (F1 ≈ 0.93, AUC ≈ 0.98). Logistic regression was the weakest model in cross-validation, because each fold had too few samples, but it tied for best once trained on all 38. Random Forest ranked every patient correctly (AUC 1.00), but the default 0.5 threshold cost it five AML cases.</p>
    <p>The top SHAP genes were ZYX, FAH, CST3, CHRNA7 and PTX3. Zyxin was also the highest-weighted gene in Golub's hand-picked 50-gene signature, and FAH and CST3 appear in it too. So the model is relying on biologically meaningful genes. Golub reported about 85% accuracy and declined to predict five uncertain cases; the best models here reach 94% with no abstentions.</p>

    <h2>Limitations</h2>
    <ul>
      <li>With 34 test patients, these accuracy figures carry real statistical uncertainty.</li>
      <li>A clinical tool would need to flag cases it's unsure about for review, rather than always returning ALL or AML.</li>
    </ul>

    <h1>Tissue-specific complement gene expression: liver vs. lymph node</h1>
    <p class="lead">I tested whether the liver is the main production site for the terminal complement components (C8A, C8B, C9) and the factor H-related regulators (CFHR2–5). Lymph node was the comparison because it's where complement gets used rather than made.</p>
  </div></div>
  <div class="page-body"><div class="pp-inner">
    <dl class="details">
      <div><dt>Type</dt><dd>Course project</dd></div>
      <div><dt>Data</dt><dd>Human Protein Atlas, 3 liver + 3 lymph node</dd></div>
      <div><dt>Reads</dt><dd>Single-end bulk RNA-seq</dd></div>
      <div><dt>Compute</dt><dd>BioMix HPC cluster</dd></div>
    </dl>
    <figure><img src="rnaseq_de.png" alt="4,502 genes higher in liver and 4,256 higher in lymph node at FDR below 0.05"><figcaption>Differentially expressed genes between the two tissues (edgeR exact test, FDR &lt; 0.05).</figcaption></figure>

    <h2>What I did</h2>
    <p>I ran the full pipeline on the cluster as batch jobs, one script per stage with a loop over the six samples: FastQC for quality control, TrimGalore for trimming, alignment with both STAR and HISAT2 as a cross-check, and featureCounts for quantification. Both aligners mapped over 95% of reads.</p>
    <p>For differential expression I used both DESeq2 and edgeR, since they normalize and test differently and agreement between them is reassuring. DESeq2 gave the final significance calls, and edgeR's top 200 genes went into Enrichr for pathway enrichment and STRING with MCODE for network analysis.</p>

    <h2>What I found</h2>
    <div class="nums"><div><b>98%</b><span>of variance on PC1, separating the tissues</span></div><div><b>7 of 7</b><span>complement genes higher in liver</span></div><div><b>3.25×10⁻²³</b><span>adj. p, complement and coagulation cascades</span></div></div>
    <p>All seven complement genes were significantly higher in liver. The stronger evidence came without looking for them: complement and coagulation cascades was the single most enriched KEGG pathway (22 of 85 genes). In STRING, all seven genes formed one MCODE cluster in which every gene connects to all six others. The top differentially expressed genes overall were classic liver markers: APOH, ALDOB, FGG, APOB and PLG.</p>

    <h2>Limitations</h2>
    <ul>
      <li>Three samples per tissue is small. The effect is large enough to survive that, but more replicates would help.</li>
      <li>This is bulk tissue. Liver is mostly hepatocytes and lymph node mostly lymphocytes, so I can't separate regulation from cell composition. Single-cell or single-nucleus data would.</li>
      <li>Some log₂ fold changes near −16 reflect genes that are essentially absent in lymph node, not a smoothly measured effect.</li>
      <li>The finding confirms known biology. The real aim was to build and validate the pipeline, and the biology was the check that it worked.</li>
    </ul>

    <p class="lead">Drugs like methimazole treat hyperthyroidism by inhibiting thyroid peroxidase (TPO), but they carry real toxicity. I screened natural flavonoids as potentially safer alternatives.</p>

    <h2>What I did</h2>
    <p>I built a homology model of TPO's catalytic domain with SwissModel and validated it (ProSA Z-score −10.57, over 90% of residues in favored Ramachandran regions). I docked four flavonoids (Rutin, Kaempferol, Mearnsitrin and Rosmarinic acid) and four approved drugs with CB-Dock and AutoDock Vina. The top complexes went through 10 ns molecular dynamics in Desmond, and I predicted toxicity and drug-likeness with ProTox 3.0 and SwissADME.</p>

    <p>Every flavonoid bound TPO two to three times more strongly than every drug. Rutin was the lead candidate: the strongest binder, a stable complex across the simulation, and a far safer predicted toxicity profile than methimazole.</p>
    <figure><img src="tpo_fig2_rutin_vs_drug.svg" alt="Rutin vs methimazole: binding energy and predicted LD50"><figcaption>Rutin compared with methimazole, the current standard drug.</figcaption></figure>

    <h2>Limitations</h2>
    <p>This is an in-silico study. Binding energies and toxicity are predictions, so the results generate hypotheses and would need lab validation.</p>

    <p class="lead">Asthma is one of the most common chronic diseases in U.S. children. Using national survey data, I asked which factors are associated with an asthma diagnosis, and whether simple, interpretable models do as well as machine learning.</p>

function initHome(){
 const c=document.getElementById("align");if(!c)return;
 const ctx=c.getContext("2d");const css=getComputedStyle(document.documentElement);
 const col=k=>css.getPropertyValue(k).trim();
 const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
 const dpr=Math.min(2,devicePixelRatio||1);
 const ease=p=>{p=Math.min(1,Math.max(0,p));return p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2};
 let k=1;const mono=(sz,w=500)=>`${w} ${sz*k*dpr}px "IBM Plex Mono",monospace`;
 const rrect=(x,y,w,h,r)=>{ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)};
 const steps=["fastqc  reads.fq","bwa mem  ref.fa","gatk HaplotypeCaller","Rscript  plot.R"],labels=["QC","alignment","variant calling","analysis"];
 let W,H,bars,t0;
 function size(){const r=c.getBoundingClientRect();W=c.width=Math.round(r.width*dpr);H=c.height=Math.round(r.height*dpr);k=Math.min(1.35,Math.max(1,r.width/330))}
 function build(){bars=[...Array(9)].map(()=>.25+Math.random()*.75);t0=performance.now()}
 function helix(cx,y0,y1,amp,t,n,alpha){const B4=["--A","--C","--G","--T"];
  for(let i=0;i<n;i++){const y=y0+i*(y1-y0)/(n-1),a=i*.55+t,x1=cx+Math.sin(a)*amp,x2=cx-Math.sin(a)*amp,z=Math.cos(a);
   ctx.globalAlpha=alpha*.8;ctx.lineWidth=2.4*dpr;ctx.lineCap="round";ctx.strokeStyle=col(B4[i%4]);ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo((x1+x2)/2,y);ctx.stroke();
   ctx.strokeStyle=col(B4[(i+2)%4]);ctx.beginPath();ctx.moveTo((x1+x2)/2,y);ctx.lineTo(x2,y);ctx.stroke();
   ctx.globalAlpha=alpha;ctx.fillStyle=col("--ink");ctx.beginPath();ctx.arc(x1,y,(z>0?3.4:2.4)*dpr,0,7);ctx.fill();ctx.fillStyle=col("--accent");ctx.beginPath();ctx.arc(x2,y,(z>0?2.4:3.4)*dpr,0,7);ctx.fill()}ctx.globalAlpha=1}
 function draw(t){ctx.clearRect(0,0,W,H);const fade=t>9.2?1-ease((t-9.2)/.8):1;
  helix(W*.12,H*.12,H*.86,W*.055,t*1.6,13,fade);ctx.globalAlpha=fade;
  const wx=W*.27,wy=H*.08,ww=W*.69,wh=H*.84;
  ctx.fillStyle="#0a1822";rrect(wx,wy,ww,wh,7*dpr);ctx.fill();ctx.strokeStyle=col("--line");ctx.lineWidth=1*dpr;ctx.stroke();
  ctx.fillStyle="rgba(255,255,255,.08)";rrect(wx,wy,ww,14*dpr,[7*dpr,7*dpr,0,0]);ctx.fill();
  ["--T","--G","--A"].forEach((k,i)=>{ctx.fillStyle=col(k);ctx.beginPath();ctx.arc(wx+9*dpr+i*9*dpr,wy+7*dpr,2.6*dpr,0,7);ctx.fill()});
  ctx.fillStyle="rgba(255,255,255,.55)";ctx.font=mono(8);ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("terminal",wx+ww/2,wy+7.5*dpr);
  const x=wx+10*dpr,lh=wh*.12;ctx.textAlign="left";
  steps.forEach((st,i)=>{const p=t-(.6+i*1.3);if(p<0)return;const y=wy+26*dpr+i*lh;const typed=st.slice(0,Math.floor(Math.min(1,p/.6)*st.length));
   ctx.fillStyle="rgba(255,255,255,.45)";ctx.font=mono(8.5);ctx.fillText("$",x,y);ctx.fillStyle="rgba(255,255,255,.88)";ctx.fillText(typed,x+10*dpr,y);
   if(p>.9){ctx.fillStyle=col("--A");ctx.font=mono(8.5,600);ctx.textAlign="right";ctx.fillText("✓ "+labels[i],wx+ww-10*dpr,y);ctx.textAlign="left"}
   else if(Math.floor(t*3)%2){ctx.fillStyle="rgba(255,255,255,.8)";ctx.fillRect(x+10*dpr+ctx.measureText(typed).width+2*dpr,y-5*dpr,5*dpr,10*dpr)}});
  const pp=ease((t-6)/1.2);if(pp>0){const L=x,R=wx+ww-10*dpr,Bm=wy+wh-10*dpr,T=wy+26*dpr+4*lh+4*dpr,bw=(R-L)/bars.length;
   bars.forEach((b,i)=>{ctx.fillStyle=i===4?col("--T"):col("--accent");ctx.globalAlpha=fade*.9;const h=(Bm-T)*b*pp;rrect(L+i*bw+bw*.18,Bm-h,bw*.64,h,2*dpr);ctx.fill()})}
  ctx.globalAlpha=1;ctx.textBaseline="alphabetic"}
 function frame(now){if(!document.getElementById("align")){raf=null;return}
  let t=(now-t0)/1000;if(t>10){build();t=0}draw(t);raf=requestAnimationFrame(frame)}
 size();build();
 addEventListener("resize",()=>{if(document.getElementById("align")){size();if(reduce)draw(8)}});

}
